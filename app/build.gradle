apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"

    defaultConfig {
        applicationId "com.example.assetssm"
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.Activity_mainOfficerList_cardProfile_more.runner.AndroidJUnitRunner"
        //
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    implementation 'com.google.android.material:material:1.0.0'

    //image circle
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //chart
    implementation 'com.github.AnyChart:AnyChart-Android:1.1.2'
    //chart multidex
    implementation 'androidx.multidex:multidex:2.0.1'
    //calender timetable
    implementation 'devs.mulham.horizontalcalendar:horizontalcalendar:1.3.4'
    //transport maps
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    //api
    implementation 'com.squareup.retrofit2:retrofit:2.6.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.6.2'
    //swipe background
    implementation 'it.xabaras.android:recyclerview-swipedecorator:1.1'
    //vertical stepper
    implementation 'com.ernestoyaquello.stepperform:vertical-stepper-form:2.3.0'

}
